version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phytocuckoo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - phytocuckoo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phytocuckoo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - phytocuckoo-network

networks:
  phytocuckoo-network:
    driver: bridge
